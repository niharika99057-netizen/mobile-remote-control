<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Control Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header h1 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 28px;
        }
        .share-section {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .share-section label {
            display: block;
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .share-link {
            display: flex;
            gap: 10px;
        }
        .share-link input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: monospace;
        }
        .share-link button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .share-link button:hover {
            background: #764ba2;
        }
        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .device-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .device-card:hover {
            transform: translateY(-5px);
        }
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 15px;
        }
        .device-header h2 {
            color: #667eea;
            font-size: 20px;
        }
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status.online {
            background: #d4edda;
            color: #155724;
        }
        .status.offline {
            background: #f8d7da;
            color: #721c24;
        }
        .device-info {
            margin-bottom: 20px;
            font-size: 14px;
        }
        .device-info p {
            color: #666;
            margin-bottom: 8px;
        }
        .device-info strong {
            color: #333;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .control-btn {
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 12px;
        }
        .control-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }
        .control-btn:active {
            transform: scale(0.95);
        }
        .control-btn.danger {
            background: #dc3545;
        }
        .control-btn.danger:hover {
            background: #c82333;
        }
        .no-devices {
            background: white;
            padding: 60px 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .no-devices h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 24px;
        }
        .no-devices p {
            color: #666;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .activity-log {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .activity-log h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .log-entry {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-entry .time {
            color: #999;
            font-weight: bold;
        }
        .log-entry .action {
            color: #667eea;
            font-weight: bold;
            flex: 1;
            margin: 0 15px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .modal-content h2 {
            color: #667eea;
            margin-bottom: 15px;
        }
        .modal-content p {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .confirm-btn {
            background: #667eea;
            color: white;
        }
        .confirm-btn:hover {
            background: #764ba2;
        }
        .cancel-btn {
            background: #ccc;
            color: #333;
        }
        .cancel-btn:hover {
            background: #bbb;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🎮 Mobile Control Dashboard</h1>
            <div class="share-section">
                <label>📱 अपना Link साझा करें:</label>
                <div class="share-link">
                    <input type="text" id="shareLink" readonly value="https://niharika99057-netizen.github.io/mobile-remote-control/">
                    <button onclick="copyLink()">📋 Copy Link</button>
                </div>
                <p style="color: #666; font-size: 12px; margin-top: 10px;">इस link को अपने customer को भेजो, वह click करे और तुम्हें access मिल जायेगा।</p>
            </div>
        </div>

        <div id="devicesContainer"></div>

        <div class="activity-log">
            <h3>📊 गतिविधि लॉग</h3>
            <div id="activityLog"></div>
        </div>
    </div>

    <!-- Control Modal -->
    <div id="controlModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">📱 Device Control</h2>
            <p id="modalMessage"></p>
            <div class="modal-buttons">
                <button class="confirm-btn" onclick="confirmControl()">✅ हाँ</button>
                <button class="cancel-btn" onclick="closeModal()">❌ रद्द करो</button>
            </div>
        </div>
    </div>

    <script>
        // Sample connected devices data
        let devices = [];
        let activityLogs = [];
        let currentControlAction = null;

        // Initialize with some demo devices
        function initDemo() {
            devices = [
                {
                    id: 1,
                    name: 'Customer 1',
                    phone: '+91-98XXXXX123',
                    status: 'online',
                    connectedTime: '5 मिनट पहले',
                    lastActivity: 'Link click किया',
                    timestamp: new Date(Date.now() - 5 * 60000)
                },
                {
                    id: 2,
                    name: 'Customer 2',
                    phone: '+91-97XXXXX456',
                    status: 'online',
                    connectedTime: '15 मिनट पहले',
                    lastActivity: 'access दिया',
                    timestamp: new Date(Date.now() - 15 * 60000)
                }
            ];

            activityLogs = [
                { time: '11:35 AM', action: 'Customer 1 - Link click किया' },
                { time: '11:30 AM', action: 'Customer 2 - Access दिया' },
                { time: '11:25 AM', action: 'Link साझा किया' }
            ];

            renderDevices();
            renderActivityLog();
        }

        function renderDevices() {
            const container = document.getElementById('devicesContainer');
            
            if (devices.length === 0) {
                container.innerHTML = `
                    <div class="no-devices">
                        <h2>📱 कोई Device जुड़ा नहीं है</h2>
                        <p>अपना Link साझा करो और अपने customer को access दो!</p>
                        <button class="control-btn" onclick="copyLink()" style="max-width: 200px; margin: 0 auto;">📋 Link Copy करो</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="devices-grid">
                    ${devices.map(device => `
                        <div class="device-card">
                            <div class="device-header">
                                <h2>${device.name}</h2>
                                <span class="status ${device.status}">${device.status === 'online' ? '🟢 Online' : '⚫ Offline'}</span>
                            </div>
                            <div class="device-info">
                                <p><strong>📱 Phone:</strong> ${device.phone}</p>
                                <p><strong>⏰ Connected:</strong> ${device.connectedTime}</p>
                                <p><strong>📍 Last Activity:</strong> ${device.lastActivity}</p>
                            </div>
                            <div class="controls">
                                <button class="control-btn" onclick="showControlModal(${device.id}, 'स्क्रीनशॉट ले सकते हो?', 'screenshot')">📸 Screenshot</button>
                                <button class="control-btn" onclick="showControlModal(${device.id}, 'फोन लॉक करने हैं?', 'lock')">🔒 Lock</button>
                                <button class="control-btn" onclick="showControlModal(${device.id}, 'Files देख सकते हो?', 'files')">📁 Files</button>
                                <button class="control-btn" onclick="showControlModal(${device.id}, 'Messages देख सकते हो?', 'messages')">💬 Messages</button>
                                <button class="control-btn" onclick="showControlModal(${device.id}, 'कैमरा ऑन करना है?', 'camera')">📷 Camera</button>
                                <button class="control-btn danger" onclick="showControlModal(${device.id}, 'एक्सेस disconnect करने हैं?', 'disconnect')">❌ Disconnect</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderActivityLog() {
            const container = document.getElementById('activityLog');
            container.innerHTML = activityLogs.map(log => `
                <div class="log-entry">
                    <span class="time">${log.time}</span>
                    <span class="action">${log.action}</span>
                </div>
            `).join('');
        }

        function showControlModal(deviceId, message, action) {
            currentControlAction = { deviceId, action };
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('controlModal').classList.add('active');
        }

        function confirmControl() {
            if (currentControlAction) {
                const actions = {
                    'screenshot': '📸 Screenshot लिया गया',
                    'lock': '🔒 Phone lock किया गया',
                    'files': '📁 Files access किया गया',
                    'messages': '💬 Messages देखे गए',
                    'camera': '📷 Camera activate किया गया',
                    'disconnect': '❌ Access disconnect किया गया'
                };

                // Add to activity log
                const now = new Date();
                const time = now.getHours().toString().padStart(2, '0') + ':' + 
                            now.getMinutes().toString().padStart(2, '0');
                activityLogs.unshift({
                    time: time + ' AM',
                    action: actions[currentControlAction.action]
                });

                renderActivityLog();
                closeModal();
                alert('✅ ' + actions[currentControlAction.action]);
            }
        }

        function closeModal() {
            document.getElementById('controlModal').classList.remove('active');
            currentControlAction = null;
        }

        function copyLink() {
            const link = document.getElementById('shareLink').value;
            navigator.clipboard.writeText(link);
            alert('✅ Link copy हो गया! अपने customer को भेज दो।');
        }

        // Initialize
        initDemo();
    </script>
</body>
</html>
