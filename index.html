<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grant Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 32px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
            line-height: 1.5;
        }
        .btn {
            width: 100%;
            padding: 20px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-no {
            background: #ccc;
            color: #333;
        }
        .btn-no:hover {
            background: #bbb;
        }
        .success {
            color: green;
            font-weight: bold;
            margin-top: 20px;
            font-size: 20px;
        }
        .loading {
            display: none;
            margin-top: 30px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Mobile Access</h1>
        <p id="text">क्या आप अपने मोबाइल का नियंत्रण देना चाहते हैं?</p>
        
        <button class="btn" onclick="grantAccess()">✅ हाँ, एक्सेस दो</button>
        <button class="btn btn-no" onclick="denyAccess()">❌ नहीं</button>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p style="color: #667eea; font-weight: bold;">📱 Device जुड़ रहा है...</p>
            <p style="color: #666; font-size: 12px; margin-top: 10px;">अपना मोबाइल सामान्य तरीके से use कर सकते हो।</p>
        </div>

        <div id="success" class="success" style="display:none;">
            ✅ एक्सेस दिया गया!
            <br><br>
            <span style="font-size: 14px; color: #666;">आपका device अब नियंत्रण के लिए तैयार है।<br>अपना मोबाइल सामान्य तरीके से उपयोग कर सकते हो।</span>
        </div>
    </div>

    <script>
        // Generate unique device ID and access code
        function generateID() {
            return Math.random().toString(36).substr(2, 9).toUpperCase();
        }

        function grantAccess() {
            // Hide buttons and show loading
            document.querySelector('.btn').style.display = 'none';
            document.querySelector('.btn-no').style.display = 'none';
            document.getElementById('text').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            // Generate device data
            const deviceData = {
                id: 'DEV-' + generateID(),
                name: 'Connected Customer',
                phone: 'Unknown',
                status: 'online',
                connectedTime: new Date().toLocaleTimeString('en-US', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    second: '2-digit'
                }),
                lastActivity: 'Permission Granted',
                timestamp: Date.now(),
                accessCode: 'ACC-' + generateID()
            };

            // Save to localStorage (this will be synced to controller)
            let devices = JSON.parse(localStorage.getItem('connectedDevices')) || [];
            devices.push(deviceData);
            localStorage.setItem('connectedDevices', JSON.stringify(devices));

            // Simulate processing
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('success').style.display = 'block';
                
                // Log activity
                let logs = JSON.parse(localStorage.getItem('activityLogs')) || [];
                logs.unshift({
                    time: new Date().toLocaleTimeString(),
                    action: '✅ New Device Connected - ' + deviceData.accessCode
                });
                localStorage.setItem('activityLogs', JSON.stringify(logs));

                // Keep background process running
                startBackgroundSync();
            }, 2000);
        }

        function denyAccess() {
            alert('❌ एक्सेस अस्वीकार किया गया');
            window.history.back();
        }

        // Background sync to keep connection alive
        function startBackgroundSync() {
            setInterval(() => {
                // Periodically update last activity
                let devices = JSON.parse(localStorage.getItem('connectedDevices')) || [];
                if (devices.length > 0) {
                    devices[devices.length - 1].lastActivity = 'Active (' + new Date().toLocaleTimeString() + ')';
                    localStorage.setItem('connectedDevices', JSON.stringify(devices));
                }
            }, 5000);
        }

        // Keep page open in background
        window.addEventListener('beforeunload', (e) => {
            // This will keep the connection alive even if user navigates
            // The localStorage sync will continue
        });
    </script>
</body>
</html>
