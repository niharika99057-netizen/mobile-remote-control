<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grant Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 32px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
            line-height: 1.5;
        }
        .btn {
            width: 100%;
            padding: 20px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-no {
            background: #ccc;
            color: #333;
        }
        .btn-no:hover {
            background: #bbb;
        }
        .success {
            color: green;
            font-weight: bold;
            margin-top: 20px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Mobile Access</h1>
        <p id="text">क्या आप अपने मोबाइल का नियंत्रण देना चाहते हैं?</p>
        
        <button class="btn" onclick="grantAccess()">✅ हाँ, एक्सेस दो</button>
        <button class="btn btn-no" onclick="denyAccess()">❌ नहीं</button>
        
        <div id="success" class="success" style="display:none;">
            ✅ एक्सेस दिया गया!
            <br><br>
            <span style="font-size: 14px;">आपका मोबाइल कंट्रोल हो सकता है।</span>
        </div>
    </div>

    <script>
        function grantAccess() {
            document.querySelector('.btn').disabled = true;
            document.querySelector('.btn-no').disabled = true;
            document.getElementById('text').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            
            // Simulate sending access to server
            setTimeout(() => {
                alert('✅ आपका एक्सेस दे दिया गया है!');
            }, 500);
        }

        function denyAccess() {
            alert('❌ एक्सेस अस्वीकार किया गया');
            window.close();
        }
    </script>
</body>
</html>
