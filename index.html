<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grant Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 32px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
            line-height: 1.5;
        }
        .btn {
            width: 100%;
            padding: 20px;
            border: none;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-no {
            background: #ccc;
            color: #333;
        }
        .btn-no:hover {
            background: #bbb;
        }
        .success {
            color: green;
            font-weight: bold;
            margin-top: 20px;
            font-size: 20px;
        }
        .code-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 Mobile Access</h1>
        <p id="text">क्या आप अपने मोबाइल का नियंत्रण देना चाहते हैं?</p>
        
        <button class="btn" onclick="grantAccess()">✅ हाँ, एक्सेस दो</button>
        <button class="btn btn-no" onclick="denyAccess()">❌ नहीं</button>
        
        <div id="success" class="success" style="display:none;">
            ✅ एक्सेस दिया गया!
            <br><br>
            <span style="font-size: 14px;">आपका मोबाइल कंट्रोल हो सकता है।</span>
            <div class="code-box">
                🔑 Code: <span id="accessCode"></span>
            </div>
            <p style="font-size: 12px; color: #666; margin-top: 15px;">इस कोड को अपने controller को भेज दो</p>
        </div>
    </div>

    <script>
        // Generate unique access code
        function generateAccessCode() {
            return 'ACC-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        }

        const accessCode = generateAccessCode();

        function grantAccess() {
            // Store in localStorage
            const deviceData = {
                id: generateAccessCode(),
                name: 'Customer Device',
                phone: 'Unknown',
                status: 'online',
                connectedTime: new Date().toLocaleTimeString(),
                lastActivity: 'access दिया',
                timestamp: new Date().getTime(),
                accessCode: accessCode
            };

            // Save to localStorage
            let devices = JSON.parse(localStorage.getItem('connectedDevices')) || [];
            devices.push(deviceData);
            localStorage.setItem('connectedDevices', JSON.stringify(devices));

            // Also save the device info for controller
            localStorage.setItem('lastAccessCode', accessCode);
            localStorage.setItem('lastDeviceConnected', new Date().toISOString());

            document.querySelector('.btn').disabled = true;
            document.querySelector('.btn-no').disabled = true;
            document.getElementById('text').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            document.getElementById('accessCode').textContent = accessCode;
            
            // Keep the page alive so controller can connect
            console.log('Device registered with code:', accessCode);
        }

        function denyAccess() {
            alert('❌ एक्सेस अस्वीकार किया गया');
            window.history.back();
        }
    </script>
</body>
</html>
